{% extends "base.html" %}

{% block content %}

<h1 class="post-title">{{ term.name }}</h1>
<h2 class="post-subtitle"><span><em>{{ taxonomy.name }}</em></span></h2>

<hr>

<ul>
{% for page in term.pages %}
    <li><a href="{{ page.permalink | safe }}">{{ page.title }}</a></li>
{% endfor %}
</ul>

{% endblock content %}
