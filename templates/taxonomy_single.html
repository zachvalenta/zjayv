{% extends "base.html" %}

{% block content %}

<h1 class="title">{{ term.name }}</h1>
<p class="subtitle">{{ taxonomy.name }}</p>

<ul class="taxonomy-list">
{% for page in term.pages %}
    <li><a href="{{ page.permalink | safe }}">{{ page.title }}</a></li>
{% endfor %}
</ul>

{% endblock content %}
