{% extends "base.html" %}

{% block content %}

<h1 class="post-title">{{ taxonomy.name }}</h1>

<hr>

<ul>
{% for term in terms %}
    <li>
        <a href="{{ term.permalink | safe }}">{{ term.name }}</a>
        <span class="taxonomy-count">{{ term.pages | length }}</span>
    </li>
{% endfor %}
</ul>

{% endblock content %}
