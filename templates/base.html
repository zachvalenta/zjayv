<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>zach valenta</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" type="image/png" href="/favicon.png">
<script data-goatcounter="https://zjayv.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>

<body>
  <nav class="menu">
    <a class="site-title" href="/">zach valenta</a>
    <ul class="menu-items">
      <li><a href="/blog">Blog</a></li>
      <li><a href="/books">Books</a></li>
      <li><a href="/til">TIL</a></li>
      <li><a href="/about">About</a></li>
    </ul>
  </nav>

  <section class="section">
    <div class="container">
      {% block content %} {% endblock %}
    </div>
  </section>
<script>
(function() {
  var sidebar = document.querySelector('.toc-sidebar');
  if (!sidebar) return;

  var tocLinks = sidebar.querySelectorAll('a[href*="#"]');
  var headings = Array.from(document.querySelectorAll('.main-content h1[id], .main-content h2[id], .main-content h3[id]'));

  if (!headings.length || !tocLinks.length) return;

  var linkMap = {};
  tocLinks.forEach(function(link) {
    var hash = link.getAttribute('href').split('#')[1];
    if (hash) linkMap[hash] = link;
  });

  var currentActive = null;

  function setActive(id) {
    if (id === currentActive) return;
    currentActive = id;
    tocLinks.forEach(function(l) { l.classList.remove('active'); });
    if (id && linkMap[id]) linkMap[id].classList.add('active');
  }

  function updateActive() {
    var threshold = window.scrollY + window.innerHeight * 0.25;
    var activeId = null;
    for (var i = 0; i < headings.length; i++) {
      if (headings[i].offsetTop <= threshold) activeId = headings[i].id;
    }
    setActive(activeId);
  }

  window.addEventListener('scroll', updateActive, { passive: true });
  updateActive();
})();
</script>
</body>

</html>
