{% extends "base.html" %}

{% block content %}

<h1 class="post-title">
  <a href="{{ page.permalink | safe }}">{{ page.title }}</a>
</h1>
{% if page.date %}
<h2 class="post-subtitle">
  <span><em>{{ page.date | date(format="%b %-d, %Y") }}</em></span>
</h2>
{% endif %}

<hr>

{{ page.content | safe }}

{% endblock content %}
